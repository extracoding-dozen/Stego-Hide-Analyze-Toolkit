name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # --- ЗАДАЧА №1: СБОРКА БИНАРНИКОВ НА РОДНЫХ СИСТЕМАХ ---
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output_name: stego-toolkit-linux
            asset_ext: ""
          - os: windows-latest
            output_name: stego-toolkit-windows
            asset_ext: ".exe"
          - os: macos-latest
            output_name: stego-toolkit-macos
            asset_ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      # Устанавливаем системные зависимости только для Linux
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev libgtk-3-dev
      
      - name: Tidy and Download modules
        run: go mod tidy

      # Собираем бинарник (без кросс-компиляции, все нативно)
      - name: Build Binary
        run: go build -v -o ${{ matrix.output_name }}${{ matrix.asset_ext }} ./cmd/main.go

      # Загружаем собранный файл как артефакт
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: ${{ matrix.output_name }}${{ matrix.asset_ext }}

  # --- ЗАДАЧА №2: СОЗДАНИЕ РЕЛИЗА ПОСЛЕ УСПЕШНОЙ СБОРКИ ---
  release:
    name: Create GitHub Release
    # Эта задача зависит от успешного выполнения задачи 'build'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем право на запись (создание релиза)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Скачиваем ВСЕ артефакты, созданные в задаче 'build'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Упаковываем каждый бинарник в свой ZIP-архив
      - name: Package artifacts into ZIPs
        run: |
          cd artifacts
          # Упаковываем Windows
          cd binary-windows-latest && zip ../stego-toolkit-windows.zip * && cd ..
          # Упаковываем Linux
          cd binary-ubuntu-latest && zip ../stego-toolkit-linux.zip * && cd ..
          # Упаковываем macOS
          cd binary-macos-latest && zip ../stego-toolkit-macos.zip * && cd ..

      # Создаем релиз и прикрепляем к нему три ZIP-архива
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/stego-toolkit-windows.zip
            artifacts/stego-toolkit-linux.zip
            artifacts/stego-toolkit-macos.zip